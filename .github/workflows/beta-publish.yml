name: Publish beta

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: crates-io-beta-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify beta release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Require a prerelease workspace version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != *-* ]]; then
            echo "Refusing to publish non-prerelease version: $version" >&2
            exit 1
          fi
          echo "Publishing workspace prerelease $version"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Test documentation
        run: cargo test --locked --workspace --all-features --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build distributable crate archives
        run: cargo package --locked --workspace --no-verify

  msrv:
    name: Verify Rust 1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Test minimum supported Rust version
        run: cargo test --locked --workspace --all-features

  postgres:
    name: Verify PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - run: cargo test --locked -p mads-common --test database_postgres -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-common server::tests::database_migration_failure_prevents_listener_binding -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-cli --test database_cli -- --ignored --test-threads=1
      - run: cargo test --locked -p mads --test postgres_crud -- --ignored --test-threads=1

  publish:
    name: Publish crates to crates.io
    needs:
      - verify
      - msrv
      - postgres
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Repository or beta environment secret CRATES_IO_TOKEN is not configured." >&2
            exit 1
          fi

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          packages=(
            mads-core-macros
            mads-common-macros
            mads-core
            mads-extra
            mads-common
            mads
            mads-cli
          )

          is_published() {
            local package="$1"
            cargo info --registry crates-io "${package}@${version}" >/dev/null 2>&1
          }

          for package in "${packages[@]}"; do
            if is_published "$package"; then
              echo "Skipping ${package} ${version}: already published."
              continue
            fi

            echo "Publishing ${package} ${version}"
            cargo publish --locked --package "$package"
          done
      - name: Create GitHub prerelease and tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Skipping ${tag}: GitHub release already exists."
            exit 0
          fi

          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "MADS.rs ${version}" \
            --prerelease \
            --latest=false \
            --notes-file -
