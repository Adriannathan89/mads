[package]
name = "mads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mads-common = { path = "../mads-common", optional = true, default-features = false }
mads-core = { path = "../mads-core" }
mads-extra = { path = "../mads-extra", optional = true }

[dev-dependencies]
diesel.workspace = true
diesel_migrations.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[features]
default = ["common", "runtime-tokio"]
common = ["http", "database"]
http = ["dep:mads-common", "mads-common/http"]
database = ["dep:mads-common", "mads-common/database"]
jwt = ["dep:mads-common", "mads-common/jwt"]
cookies = ["http", "mads-common/cookies"]
runtime-tokio = ["mads-core/runtime-tokio"]
extra = ["dep:mads-extra"]

[lints]
workspace = true
