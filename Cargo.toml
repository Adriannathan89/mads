[workspace]
resolver = "3"
members = [
    "crates/mads",
    "crates/mads-core",
    "crates/mads-core-macros",
    "crates/mads-common",
    "crates/mads-common-macros",
    "crates/mads-cli",
    "crates/mads-extra",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["MADS.rs contributors"]
repository = "https://github.com/Adriannathan89/mads"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
inventory = "0.3"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
